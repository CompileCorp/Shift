name: PR Build and Test

# Trigger only on pull requests
on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    # Send Slack notification immediately when PR is opened
    - name: Notify on PR opened
      if: github.event.action == 'opened'
      run: |
        curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🔔 New Pull Request: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}> by ${{ github.event.pull_request.user.login }}"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

    # Checkout the repository code.
    # Line endings are governed by the committed .gitattributes (LF everywhere),
    # so no per-runner git config is needed.
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup .NET 9.0.x 
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # Restore all NuGet packages for the solution
    - name: Restore dependencies
      run: dotnet restore src/Shift.slnx

    # Check code formatting - fail if there are pending formatting changes
    - name: Check code formatting
      run: dotnet format src/Shift.slnx --verify-no-changes --verbosity diagnostic
    
    # Build the entire solution in Release configuration
    - name: Build solution
      run: dotnet build src/Shift.slnx --configuration Release --no-restore

    # Run all tests in the solution with TRX logger for test reporting and
    # collect code coverage using the shared runsettings (scope/exclusions defined there).
    # A test failure must fail the build, so continue-on-error is intentionally NOT set.
    - name: Run tests
      run: dotnet test src/Shift.slnx --configuration Release --no-build --verbosity normal --settings src/coverlet.runsettings --collect:"XPlat Code Coverage" --logger "trx" --results-directory TestResults

    # Publish test results to GitHub PR interface for clear visual feedback
    # Uses wildcard pattern to collect all TRX files from all test projects
    - name: Publish Test Results
      uses: dorny/test-reporter@v2
      if: always()
      with:
        name: Test Results
        path: TestResults/**/*.trx
        reporter: dotnet-trx
        fail-on-error: true

    # Coverage steps run only when the build and tests succeeded (default success() condition).
    # This avoids confusing "no report files" / missing-summary errors cascading from an earlier
    # failure (e.g. a formatting or build failure) when no coverage was ever produced.
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: |
        reportgenerator \
          -reports:"TestResults/**/coverage.cobertura.xml" \
          -targetdir:"CoverageReport" \
          -reporttypes:"Html;JsonSummary;MarkdownSummaryGithub"

    - name: Publish coverage to job summary
      run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: CoverageReport

    # Fail the build if line coverage drops below the agreed threshold.
    # Ratchet COVERAGE_THRESHOLD upward toward 100 as gaps are closed.
    - name: Enforce coverage threshold
      env:
        # Achieved 99.5%; the ~9 remaining lines are unreachable/defensive (generic catch
        # blocks, exhaustive-switch defaults, a parser-unreachable null guard).
        COVERAGE_THRESHOLD: "99"
      run: |
        # Read the machine-readable summary (stable JSON number) rather than scraping the
        # human-readable text summary, which is sensitive to label wording and locale.
        line=$(jq -r '.summary.linecoverage' CoverageReport/Summary.json)
        echo "Measured line coverage: ${line}% (threshold: ${COVERAGE_THRESHOLD}%)"
        awk -v c="$line" -v t="$COVERAGE_THRESHOLD" 'BEGIN { if (c+0 < t+0) { exit 1 } }' \
          || { echo "::error::Line coverage ${line}% is below the required ${COVERAGE_THRESHOLD}%"; exit 1; }
