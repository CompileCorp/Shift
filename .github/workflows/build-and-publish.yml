name: Build and Publish to NuGet

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering

# Least privilege: the job only reads the repository. id-token: write lets the job
# request a GitHub OIDC token, which NuGet trusted publishing exchanges for a
# short-lived API key. No long-lived NuGet key is stored in the repository.
permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
    - name: Restore dependencies
      run: dotnet restore src/Shift.slnx
      
    - name: Build solution
      run: dotnet build src/Shift.slnx --configuration Release --no-restore
      
    # Run every test project in the solution, not just Shift.Tests, so the release is
    # gated by the same suite the PR workflow runs.
    - name: Run tests
      run: dotnet test src/Shift.slnx --configuration Release --no-build --verbosity normal

    - name: Pack NuGet packages
      run: |
        dotnet pack src/Shift/Shift.csproj --configuration Release --no-build --output ./nupkgs -p:Version=${{ steps.get_version.outputs.VERSION }}
        dotnet pack src/Shift.Dbml/Shift.Dbml.csproj --configuration Release --no-build --output ./nupkgs -p:Version=${{ steps.get_version.outputs.VERSION }}
        # Shift.Cli packs as a .NET tool, which runs publish and so cannot use --no-build.
        dotnet pack src/Shift.Cli/Shift.Cli.csproj --configuration Release --output ./nupkgs -p:Version=${{ steps.get_version.outputs.VERSION }}

    # Trusted publishing: exchange the OIDC token for a temporary API key (valid ~1h).
    # NUGET_USER is the nuget.org account (profile name, not email) that owns the
    # trusted publishing policy for this repository and workflow file.
    - name: NuGet login (trusted publishing)
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    # --skip-duplicate so re-running the workflow after a partial failure (e.g. one package
    # pushed, the next rejected) succeeds instead of failing on the already-published package.
    - name: Push to NuGet.org
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

